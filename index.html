<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>OPEN CITY</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:0 2px 4px #000}#brand{position:absolute;top:14px;left:14px;font-weight:900;font-size:20px;letter-spacing:2px}#hint{position:absolute;top:42px;left:15px;font-size:11px;color:#d7e2e8}#stats{position:absolute;top:14px;right:14px;text-align:right;font-size:12px}#msg{position:absolute;top:75px;left:50%;transform:translateX(-50%);background:#111c;padding:8px 12px;border:1px solid #ffffff44;border-radius:8px;font-size:12px}#controls{position:absolute;bottom:18px;left:15px;display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(2,54px);gap:5px;pointer-events:auto}button{border:1px solid #ffffff66;background:#142431bb;color:white;border-radius:12px;font-size:22px;touch-action:none}button:active{background:#2d6688}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#actions{position:absolute;right:16px;bottom:24px;display:flex;gap:10px;pointer-events:auto}#actions button{width:62px;height:62px;font-size:12px;font-weight:bold}#run{position:absolute;right:25px;bottom:100px;width:58px;height:58px;border-radius:50%;pointer-events:auto;font-size:11px}#map{position:absolute;right:14px;top:65px;width:95px;height:95px;border:1px solid #ffffff77;border-radius:50%;background:#182b35aa}

</style></head><body><div id="hud"><div id="brand">OPEN CITY</div><div id="hint">WASD / стрелки — движение · мышь/свайп — камера · E — авто</div><div id="stats">ГОРОД: NORTHSIDE<br>ДЕНЬ · 14:30</div><div id="msg">Исследуй город. Найди машину.</div><canvas id="map" width="190" height="190"></canvas><div id="controls"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><button id="run">БЕГ</button><div id="actions"><button id="use">E<br>АВТО</button></div></div>
<script type="module">

const scene=new THREE.Scene();scene.background=new THREE.Color(0x9fc4d7);scene.fog=new THREE.Fog(0x9fc4d7,65,210);

const mat=(c,r=.85,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const ground= new THREE.Mesh(new THREE.PlaneGeometry(240,240),mat(0x62765e));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const roadMat=mat(0x252c32),sideMat=mat(0xb8b7a9),lineMat=mat(0xe8dfb5),glass=mat(0x263f50,.25,.25);
function box(w,h,d,x,y,z,m,shadow=true){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}
for(let i=-3;i<=3;i++){let x=i*32;box(10,.12,230,x,.02,0,roadMat,false);box(1.5,.18,230,x-5.8,.08,0,sideMat,false);box(1.5,.18,230,x+5.8,.08,0,sideMat,false);for(let z=-110;z<110;z+=8)box(.16,.025,3,x,.1,z,lineMat,false);
let z=i*32;box(230,.12,10,0,.02,z,roadMat,false);box(230,.18,1.5,0,.08,z-5.8,sideMat,false);box(230,.18,1.5,0,.08,z+5.8,sideMat,false);for(let x=-110;x<110;x+=8)box(3,.025,.16,x,.1,z,lineMat,false)}
const solids=[];const colors=[0xc7b7a1,0x9daeb5,0xd0c9b7,0x8e9a9c,0xc2a18d,0xb6bdad];
function building(x,z,w,d,h,seed){let c=colors[seed%colors.length],b=box(w,h,d,x,h/2,z,mat(c));solids.push({x,z,w,d});box(w+.5,.45,d+.5,x,h+.2,z,mat(0x444c50));box(w*.23,.12,.3,x,h*.55,z+d/2+.16,mat(0x3c4c54));for(let yy=2.1;yy<h-1;yy+=2.4){for(let xx=-w/2+1.2;xx<w/2-.5;xx+=2.2){box(.95,1.15,.08,x+xx,yy,z+d/2+.055,glass,false);box(.99,.08,.1,x+xx,yy-.62,z+d/2+.07,mat(0xddd4c1),false)}}}
let seed=0;for(let gx=-3;gx<4;gx++)for(let gz=-3;gz<4;gz++){if(Math.abs(gx)%1===0&&Math.abs(gz)%1===0){let x=gx*32+(gx%2?8:-8),z=gz*32+(gz%2?8:-8);if(Math.abs(x)<18&&Math.abs(z)<18)continue;building(x,z,12+(seed%3)*2,12+(seed%2)*3,10+(seed%5)*3,seed++);}}
const treeMat=mat(0x315b39),trunk=mat(0x60452f);function tree(x,z){box(.45,2,.45,x,1,z,trunk);let crown=new THREE.Mesh(new THREE.IcosahedronGeometry(1.5,1),treeMat);crown.position.set(x,3,z);crown.castShadow=true;scene.add(crown)}for(let x=-100;x<=100;x+=16)for(let z=-100;z<=100;z+=16){if(Math.abs(x%32)>7&&Math.abs(z%32)>7)tree(x,z)}
function car(x,z,color=0xb52e27,police=false){let g=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(2.2,.75,4.2),mat(color,.42,.25));body.position.y=.85;body.castShadow=true;g.add(body);let cabin=new THREE.Mesh(new THREE.BoxGeometry(1.7,.78,2.1),glass);cabin.position.set(0,1.55,-.15);g.add(cabin);for(let xx of [-1.12,1.12])for(let zz of [-1.35,1.35]){let wh=new THREE.Mesh(new THREE.CylinderGeometry(.38,.38,.22,16),mat(0x151719));wh.rotation.z=Math.PI/2;wh.position.set(xx,.48,zz);g.add(wh)}if(police){let bar=new THREE.Mesh(new THREE.BoxGeometry(1.1,.15,.35),mat(0xeeeeee));bar.position.set(0,2.02,-.1);g.add(bar);let red=new THREE.PointLight(0xff2020,2,8);red.position.set(-.4,2.1,0);g.add(red);let blue=new THREE.PointLight(0x208aff,2,8);blue.position.set(.4,2.1,0);g.add(blue)}scene.add(g);g.position.set(x,0,z);return g}
const player=new THREE.Group();scene.add(player);const skin=mat(0xd6a47f),shirt=mat(0x24658a),pants=mat(0x273344),shoe=mat(0x171b20);
function limb(parent,w,h,d,m,x,y,z){let o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=true;parent.add(o);return o}
limb(player,.65,.85,.34,shirt,0,1.35,0);let head=new THREE.Mesh(new THREE.SphereGeometry(.25,16,12),skin);head.position.y=2.02;head.castShadow=true;player.add(head);limb(player,.22,.78,.24,pants,-.2,.55,0);limb(player,.22,.78,.24,pants,.2,.55,0);limb(player,.24,.75,.24,shirt,-.48,1.38,0);limb(player,.24,.75,.24,shirt,.48,1.38,0);limb(player,.25,.14,.4,shoe,-.2,.12,.05);limb(player,.25,.14,.4,shoe,.2,.12,.05);
player.position.set(0,0,4);
const playerCar=car(5,2,0x197d9c),traffic=[car(-25,-15,0xd7b33c),car(35,30,0x394b65),car(-45,48,0xeeeeea),car(55,-50,0x33834c),car(-8,-65,0xb42b24,true)];
const peds=[];for(let i=0;i<14;i++){let p=new THREE.Group();let top=mat([0x8e4436,0x3c7190,0x9b873f,0xeeeeea][i%4]);limb(p,.48,.7,.28,top,0,1.15,0);let h=new THREE.Mesh(new THREE.SphereGeometry(.2,12,10),skin);h.position.y=1.65;p.add(h);limb(p,.18,.65,.18,pants,-.13,.45,0);limb(p,.18,.65,.18,pants,.13,.45,0);p.position.set((Math.random()-.5)*85,0,(Math.random()-.5)*85);scene.add(p);peds.push({p,a:Math.random()*6.28,s:.5+Math.random()*.5})}
let keys={},touch={},inCar=false,carSpeed=0,yaw=0,camYaw=0,camPitch=.22,run=false;addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.key.toLowerCase()==='e')toggleCar()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,k){let el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=true;el.setPointerCapture(e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])el.addEventListener(ev,()=>touch[k]=false)}
bind('up','w');bind('down','s');bind('left','a');bind('right','d');bind('run','run');document.getElementById('use').onclick=toggleCar;
function toggleCar(){if(!inCar&&player.position.distanceTo(playerCar.position)<4){inCar=true;player.visible=false;document.getElementById('msg').textContent='Ты за рулём. E — выйти'}else if(inCar){inCar=false;player.visible=true;player.position.copy(playerCar.position).add(new THREE.Vector3(2,0,0));document.getElementById('msg').textContent='Ты вышел из машины'}}
let dragging=false,lastX=0,lastY=0;renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});addEventListener('pointerup',()=>dragging=false);addEventListener('pointermove',e=>{if(dragging){camYaw-=(e.clientX-lastX)*.005;camPitch=THREE.MathUtils.clamp(camPitch+(e.clientY-lastY)*.003,-.05,.8);lastX=e.clientX;lastY=e.clientY}});
function blocked(x,z,r=1){return solids.some(b=>Math.abs(x-b.x)<b.w/2+r&&Math.abs(z-b.z)<b.d/2+r)}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04),f=keys.w||keys.arrowup||touch.w?1:0,b=keys.s||keys.arrowdown||touch.s?1:0,l=keys.a||keys.arrowleft||touch.a?1:0,r=keys.d||keys.arrowright||touch.d?1:0;run=keys.shift||touch.run;
if(inCar){carSpeed+=(f*17-b*22)*dt;carSpeed*=Math.pow(.965,dt*60);carSpeed=THREE.MathUtils.clamp(carSpeed,-12,28);if(l||r)playerCar.rotation.y+=(l?1:-1)*dt*(.8+Math.abs(carSpeed)*.035);let dir=new THREE.Vector3(Math.sin(playerCar.rotation.y),0,Math.cos(playerCar.rotation.y));let nx=playerCar.position.x+dir.x*carSpeed*dt,nz=playerCar.position.z+dir.z*carSpeed*dt;if(!blocked(nx,nz,1.6)){playerCar.position.x=nx;playerCar.position.z=nz}else carSpeed=0}
else{let moving=f||b||l||r;if(moving){let speed=run?9:5;let angle=camYaw;let dx=(Math.sin(angle)*(f-b)+Math.cos(angle)*(r-l))*speed*dt;let dz=(Math.cos(angle)*(f-b)-Math.sin(angle)*(r-l))*speed*dt;let nx=player.position.x+dx,nz=player.position.z+dz;if(!blocked(nx,player.position.z,.55))player.position.x=nx;if(!blocked(player.position.x,nz,.55))player.position.z=nz;player.rotation.y=Math.atan2(dx,dz);let t=clock.elapsedTime*12*(run?1.4:1);player.children[2].rotation.x=Math.sin(t)*.55;player.children[3].rotation.x=-Math.sin(t)*.55}}
traffic.forEach((c,i)=>{if(c===playerCar)return;c.position.z+=dt*(i%2?5:-4);if(c.position.z>115)c.position.z=-115;if(c.position.z< -115)c.position.z=115});
peds.forEach(o=>{o.p.position.x+=Math.sin(o.a)*o.s*dt;o.p.position.z+=Math.cos(o.a)*o.s*dt;if(Math.abs(o.p.position.x)>105||Math.abs(o.p.position.z)>105)o.a+=Math.PI});
let target=inCar?playerCar.position:player.position;let dist=inCar?12:9;let desired=new THREE.Vector3(target.x+Math.sin(camYaw)*dist, target.y+4+camPitch*5,target.z+Math.cos(camYaw)*dist);camera.position.lerp(desired,1-Math.pow(.001,dt));camera.lookAt(target.x,target.y+1,target.z);

renderer.render(scene,camera)}
loop();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
