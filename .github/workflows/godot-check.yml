name: Godot project check

on:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/godot-check.yml'
  pull_request:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Godot 4.3
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.3.0
          use-dotnet: false
          include-templates: false
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
