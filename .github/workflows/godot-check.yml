name: Godot project check

on:
  push:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - '.github/workflows/godot-check.yml'
  pull_request:
    paths:
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Import project and validate scripts
        run: godot --headless --editor --path . --quit
